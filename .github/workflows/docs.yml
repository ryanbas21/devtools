name: Deploy Docs

on:
  push:
    branches: [main]
    paths:
      - 'apps/docs/**'

permissions:
  contents: read
  pages: write
  id-token: write

concurrency:
  group: 'pages'
  cancel-in-progress: false

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: pnpm/action-setup@v4

      - uses: actions/setup-node@v4
        with:
          node-version: '22'
          cache: 'pnpm'

      - run: pnpm install --frozen-lockfile

      - name: Build docs site
        run: pnpm --filter docs-site build

      - name: Prepare deploy directory
        run: |
          cd apps/docs/dist
          cp -r assets devtools/assets
          cp elm.*.js devtools/
          cp style.css devtools/ 2>/dev/null || true
          cp favicon.ico devtools/ 2>/dev/null || true
          cp content.dat devtools/ 2>/dev/null || true
          find devtools -name '*.html' -exec sed -i 's|src="/elm\.|src="/devtools/elm.|g' {} +

      - uses: actions/upload-pages-artifact@v3
        with:
          path: apps/docs/dist/devtools

  deploy:
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    runs-on: ubuntu-latest
    needs: build
    steps:
      - name: Deploy to GitHub Pages
        id: deployment
        uses: actions/deploy-pages@v4
